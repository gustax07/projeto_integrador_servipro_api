# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
 
name: Build and deploy Node.js app to Azure Web App - serviPRO
 
on:
  push:
    branches:
      - main
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
 
    permissions:
      contents: read
 
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: Criar arquivo de credenciais do Firebase
        run: |
          echo '${{ secrets.SERVIPRO_FIREBASE_ADMINSDK }}' > servipro-firebase-adminsdk.json

      - name: Install dependencies
        run: npm install
 
      - name: Generate Prisma Client
        run: npx prisma generate
 
      - name: Build project
        run: npm run build --if-present
 
      - name: Run tests
        run: npm run test --if-present
 
      # DEBUG TEMPORÁRIO
      - name: Debug Prisma
        run: |
          echo "=== .prisma ==="
          ls -la node_modules/.prisma || true
 
          echo "=== .prisma/client ==="
          ls -la node_modules/.prisma/client || true
 
          echo "=== @prisma/client ==="
          ls -la node_modules/@prisma/client || true
 
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            .
            !node_modules
 
  deploy:
    runs-on: ubuntu-latest
    needs: build
 
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
 
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
 
      # recria tudo no ambiente de deploy
      - name: Install dependencies
        run: npm install
 
      - name: Generate Prisma Client
        run: npx prisma generate
 
      # DEBUG TEMPORÁRIO
      - name: Debug Prisma before deploy
        run: |
          echo "=== .prisma ==="
          ls -la node_modules/.prisma || true
 
          echo "=== .prisma/client ==="
          ls -la node_modules/.prisma/client || true
 
          echo "=== @prisma/client ==="
          ls -la node_modules/@prisma/client || true
 
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'servipro'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_D9D7560C1E3E4239B40DCB5400F65D55 }}
